<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Null</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="glcanvas" aria-hidden="true"></canvas>

  <button
    type="button"
    id="cube-toggle"
    class="cube-btn"
    aria-label="Abrir o cerrar panel"
    aria-expanded="false"
    aria-controls="side-panel"
  >
    <img data-asset="./resource/logo_studio_0.svg" src="./resource/logo_studio_0.svg" alt="" class="cube-img" />
  </button>

  <aside id="side-panel" class="side-panel" aria-label="Panel lateral">
    <div class="side-panel-content">
      <div class="panel-top">
        <img data-asset="./resource/logo_studio.svg" src="./resource/logo_studio.svg" alt="Nexode Studio" class="panel-logo" />
      </div>
    </div>
  </aside>

  <div class="social-bar" aria-label="Redes sociales">
    <a
      href="https://www.youtube.com/@henaxdev"
      target="_blank"
      rel="noopener noreferrer"
      class="social-btn"
      aria-label="YouTube @henaxdev"
      title="YouTube"
    >
      <img data-asset="./resource/social/youtube.svg" src="./resource/social/youtube.svg" alt="YouTube" class="social-icon" />
    </a>

    <a
      href="https://www.instagram.com/henaxdev"
      target="_blank"
      rel="noopener noreferrer"
      class="social-btn"
      aria-label="Instagram @henaxdev"
      title="Instagram"
    >
      <img data-asset="./resource/social/instagram.svg" src="./resource/social/instagram.svg" alt="Instagram" class="social-icon" />
    </a>

    <a
      href="https://www.tiktok.com/@henaxdev"
      target="_blank"
      rel="noopener noreferrer"
      class="social-btn"
      aria-label="TikTok @henaxdev"
      title="TikTok"
    >
      <img data-asset="./resource/social/tiktok.svg" src="./resource/social/tiktok.svg" alt="TikTok" class="social-icon" />
    </a>
  </div>

  <script src="./bg/shader-bg.js"></script>
  <script src="./app.js"></script>
</body>
</html>
